name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.24.x"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      - name: Test
        working-directory: cli
        run: |
          go test -race ./...
          bash ../scripts/install-cli.test.sh
          sh ../scripts/standalone-cli.e2e.sh

      - name: Vet
        working-directory: cli
        run: go vet ./...

      - name: Build
        working-directory: cli
        run: go build -trimpath ./...

  cli-macos:
    name: CLI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum
      - name: Test CLI and bootstrap installer
        working-directory: cli
        run: |
          go test -race ./...
          bash ../scripts/install-cli.test.sh
          sh ../scripts/standalone-cli.e2e.sh
      - name: Vet
        working-directory: cli
        run: go vet ./...
      - name: Build
        working-directory: cli
        run: go build -trimpath ./...

  cli-windows:
    name: CLI (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum
      - name: Test CLI
        working-directory: cli
        run: go test ./...
      - name: Vet
        working-directory: cli
        run: go vet ./...
      - name: Build
        working-directory: cli
        run: go build -trimpath ./...
      - name: Parse PowerShell bootstrap installer
        shell: pwsh
        run: |
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/install-cli.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Test PowerShell bootstrap installer
        shell: pwsh
        run: |
          ./scripts/install-cli.ps1.test.ps1
          ./scripts/standalone-cli.e2e.ps1

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman version

      - name: Cache Podman container layers
        id: cache-podman
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers
          key: podman-${{ runner.os }}-postgres17-${{ hashFiles('packages/api/test/global-setup.ts', 'packages/collab/test/global-setup.ts', 'packages/api/src/db/schema.ts') }}
          restore-keys: |
            podman-${{ runner.os }}-postgres17-
            podman-${{ runner.os }}-

      - name: Pre-pull Postgres image (if cache miss)
        if: steps.cache-podman.outputs.cache-hit != 'true'
        run: podman pull postgres:17-alpine

      - name: Check database migration history
        run: pnpm --filter @markdawn/api db:check
        env:
          # drizzle-kit check is snapshot-only, but the shared config requires
          # a syntactically valid URL before it can load.
          DATABASE_URL: postgresql://markdawn:password@localhost:5432/markdawn

      - name: Run all tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, cli, cli-macos, cli-windows]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
