name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.24.x"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      - name: Test
        working-directory: cli
        run: go test -race ./...

      - name: Vet
        working-directory: cli
        run: go vet ./...

      - name: Build
        working-directory: cli
        run: go build -trimpath ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman version

      - name: Cache Podman container layers
        id: cache-podman
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers
          key: podman-${{ runner.os }}-postgres17-${{ hashFiles('packages/api/test/global-setup.ts', 'packages/collab/test/global-setup.ts', 'packages/api/src/db/schema.ts') }}
          restore-keys: |
            podman-${{ runner.os }}-postgres17-
            podman-${{ runner.os }}-

      - name: Pre-pull Postgres image (if cache miss)
        if: steps.cache-podman.outputs.cache-hit != 'true'
        run: podman pull postgres:17-alpine

      - name: Check database migration history
        run: pnpm --filter @markdawn/api db:check
        env:
          # drizzle-kit check is snapshot-only, but the shared config requires
          # a syntactically valid URL before it can load.
          DATABASE_URL: postgresql://markdawn:password@localhost:5432/markdawn

      - name: Run all tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, cli]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
          podman version

      - name: Cache Podman container layers
        id: cache-podman
        uses: actions/cache@v4
        with:
          path: ~/.local/share/containers
          key: podman-${{ runner.os }}-postgres17-e2e-${{ hashFiles('packages/api/src/db/schema.ts') }}
          restore-keys: |
            podman-${{ runner.os }}-postgres17-e2e-
            podman-${{ runner.os }}-

      - name: Pre-pull Postgres image (if cache miss)
        if: steps.cache-podman.outputs.cache-hit != 'true'
        run: podman pull postgres:17-alpine

      - name: Start PostgreSQL
        run: |
          podman run -d --name markdawn-postgres-e2e \
            --replace \
            -e POSTGRES_USER=markdawn -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=markdawn \
            -p 5432:5432 \
            docker.io/library/postgres:17-alpine
          for i in $(seq 1 30); do
            if podman exec markdawn-postgres-e2e pg_isready -U markdawn -d markdawn 2>/dev/null; then
              echo "PostgreSQL ready"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL failed to become ready"
          exit 1

      - name: Apply database migrations
        run: pnpm --filter @markdawn/api db:migrate
        env:
          DATABASE_URL: postgresql://markdawn:password@localhost:5432/markdawn

      - name: Build shared dependencies
        run: pnpm --filter @markdawn/shared run build

      - name: Start dev servers
        run: |
          pnpm dev > /tmp/dev-servers.log 2>&1 &
          echo "Dev servers starting..."
          # Wait for API (3001), collaboration (1234), and web (5173).
          for i in $(seq 1 60); do
            api_ready=0
            collab_ready=0
            web_ready=0
            if curl -sf -o /dev/null http://localhost:3001/api/health 2>/dev/null; then
              api_ready=1
            fi
            if curl -sf -o /dev/null http://localhost:1234/health 2>/dev/null; then
              collab_ready=1
            fi
            if curl -sf -o /dev/null http://localhost:5173 2>/dev/null; then
              web_ready=1
            fi
            if [ $api_ready -eq 1 ] && [ $collab_ready -eq 1 ] && [ $web_ready -eq 1 ]; then
              echo "API, collaboration, and web servers are ready"
              exit 0
            fi
            sleep 2
          done
          echo "Servers failed to start within 120s"
          cat /tmp/dev-servers.log
          exit 1
        env:
          DATABASE_URL: postgresql://markdawn:password@localhost:5432/markdawn
          BETTER_AUTH_SECRET: test-secret-that-is-at-least-32-characters-long
          COLLAB_INTERNAL_SECRET: test-collaboration-internal-secret
          BETTER_AUTH_URL: http://localhost:3001
          FRONTEND_URL: http://localhost:5173
          PORT: 3001
          NODE_ENV: development
          TEST_SETUP_TOKEN: e2e-test-setup-secret

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium firefox
        working-directory: e2e

      - name: Run e2e tests
        run: pnpm exec playwright test
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5173
          TEST_SETUP_TOKEN: e2e-test-setup-secret

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Cleanup
        if: always()
        run: podman rm -f markdawn-postgres-e2e 2>/dev/null || true
